# Committed registry. Machine-specific paths live in registry/local.yaml (gitignored).
# One Jira project + one Confluence space + one GitHub repo per project (docs/jira-workflow.md).
# Jira projects and Confluence spaces FACT, ADE, CPID were created 2026-10-04; each project is seeded as it adopts the factory.
projects:
- name: ai-software-factory
  repo: null
  stack: python
  tracker:
    kind: jira
    key: FACT
  confluence:
    space: FACT
  autonomy: supervised
  adopted: false
- name: ade
  repo: github.com/vishal7pandey/adep
  stack: python
  tracker:
    kind: jira
    key: ADE
  confluence:
    space: ADE
  autonomy: supervised
  adopted: false
- name: chatpid
  repo: github.com/vishal7pandey/chatpid
  stack: python
  tracker:
    kind: jira
    key: CPID
  confluence:
    space: CPID
  autonomy: supervised
  adopted: true
- name: ui-ux-design
  repo: github.com/vishal7pandey/ui-ux-design-knowledge-base
  stack: docs
  tracker:
    kind: none
  autonomy: supervised
  adopted: false
