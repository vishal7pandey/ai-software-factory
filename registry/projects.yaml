# Committed registry. Machine-specific paths live in registry/local.yaml (gitignored).
# One Jira project + one Confluence space + one GitHub repo per project (docs/jira-workflow.md).
# Keys below are PLANNED: they do not exist in Jira/Confluence until created by hand.
projects:
  - name: ai-software-factory
    repo: null            # local only for now
    stack: python
    tracker: {kind: jira, key: FACT}
    confluence: {space: FACT}
    autonomy: supervised
    adopted: false

  - name: ade
    repo: github.com/vishal7pandey/adep
    stack: python
    tracker: {kind: jira, key: ADE}
    confluence: {space: ADE}
    autonomy: supervised
    adopted: false

  - name: chatpid
    repo: github.com/vishal7pandey/chatpid
    stack: python
    tracker: {kind: jira, key: CPID}
    confluence: {space: CPID}
    autonomy: supervised
    adopted: false

  - name: ui-ux-design
    repo: github.com/vishal7pandey/ui-ux-design-knowledge-base
    stack: docs
    tracker: {kind: none}   # reference knowledge base, not worth a Jira project
    autonomy: supervised
    adopted: false
