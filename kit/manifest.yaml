# Index of everything `factory adopt` / `factory sync` lays into a project.
# Schema and modes: docs/ARCHITECTURE.md §3.1.  Paths in `src` are relative to the factory repo root.
version: 1

files:
  - {src: kit/AGENTS.block.md,              dest: AGENTS.md,                            mode: block}
  - {src: kit/CLAUDE.md,                    dest: CLAUDE.md,                            mode: create}
  - {src: kit/copilot-instructions.md,      dest: .github/copilot-instructions.md,      mode: create}
  - {src: kit/pull_request_template.md,     dest: .github/pull_request_template.md,     mode: create}
  - {src: kit/CODEOWNERS.md,                dest: .github/CODEOWNERS,                   mode: create}
  - {src: kit/ci/python.yml,                dest: .github/workflows/ci.yml,             mode: create, stack: python}
  - {src: kit/ci/node.yml,                  dest: .github/workflows/ci.yml,             mode: create, stack: node}
  - {src: kit/ci/generic.yml,               dest: .github/workflows/ci.yml,             mode: create, stack: [docs, other]}
  # SonarCloud (FACT-35): optional scan, inert until the project sets the secret; python and node only.
  - {src: kit/sonar/python.yml,             dest: .github/workflows/sonar.yml,          mode: create, stack: python}
  - {src: kit/sonar/node.yml,               dest: .github/workflows/sonar.yml,          mode: create, stack: node}
  - {src: kit/sonar/python.properties,      dest: sonar-project.properties,             mode: create, stack: python}
  - {src: kit/sonar/node.properties,        dest: sonar-project.properties,             mode: create, stack: node}
  # Dependabot version updates (FACT-39): the file is rendered from `dependabot_templates` below, one
  # entry per ecosystem the project uses (src/swfactory/dependabot.py); created once, never touched again.
  - {src: kit/dependabot/dependabot.yml,    dest: .github/dependabot.yml,               mode: create}
  - {src: kit/workflows/factory-verify.yml, dest: .github/workflows/factory-verify.yml, mode: managed}
  - {src: src/swfactory/verify.py,          dest: .factory/verify.py,                   mode: managed}
  - {src: kit/work-README.md,               dest: docs/work/README.md,                  mode: create}
  # Owner decisions (FACT-46): an example record to copy; never overwritten, not a record itself.
  - {src: kit/decisions/TEMPLATE.md,        dest: docs/decisions/TEMPLATE.md,           mode: create}

# Directories copied file-by-file, each file `managed`.
dirs:
  - {src: policies, dest: .factory/policies, mode: managed}
  - {src: kit/work, dest: .factory/templates/work, mode: managed}   # templates only; README is below

# Skills are copied from skills/<name>/ into every target in factory.yaml › skill_targets, mode managed.
skills: all

# Work-item doc templates (used by `feature start` / `bug start`; not copied into projects as files —
# they are rendered into docs/work/<id>-<slug>/).
work_templates:   # resolved via the factory root by the CLI; in a project they live in .factory/templates/work/
  feature_spec: kit/work/spec.feature.md
  bug_spec:     kit/work/spec.bug.md
  plan:         kit/work/plan.md
  test_plan:    kit/work/test-plan.md

# Templates the CLI reads from the factory root (`factory decision new`, FACT-46).
templates:
  decision: kit/decisions/TEMPLATE.md

# Per-ecosystem entries of `.github/dependabot.yml` (FACT-39). `{{updates}}` in the file above is replaced by one
# rendered entry per ecosystem found in the project; `{{directory}}` and `{{ecosystem}}` are filled per entry.
dependabot_templates:
  python: kit/dependabot/python.yml          # ecosystem uv (a uv.lock is beside pyproject.toml) or pip
  npm: kit/dependabot/npm.yml                # covers npm, pnpm and yarn lockfiles
  github-actions: kit/dependabot/github-actions.yml
