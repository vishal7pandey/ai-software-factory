# SonarCloud project settings (factory kit; create-mode: written once, yours to edit).
# 1. Set sonar.organization to your SonarCloud organisation key. REPLACE_ME is the marker that
#    `factory doctor` and the sonar workflow look for: the scan is skipped while it remains.
# 2. sonar.projectKey follows the convention <owner>_<repo>; `factory adopt` filled it in from the
#    GitHub origin remote (it is a marked placeholder too if there was none).
# Setup steps: docs/sonarcloud.md in the factory repository.
sonar.organization=REPLACE_ME_SONAR_ORGANIZATION
sonar.projectKey={{project_key}}

sonar.sources=.
sonar.exclusions=node_modules/**,dist/**,build/**,coverage/**,.next/**
sonar.test.inclusions=**/*.test.*,**/*.spec.*,**/__tests__/**,tests/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
