# SonarCloud analysis for an npm project (factory kit; create-mode: yours to edit).
# Safe by default: without the SONAR_TOKEN secret (fork PRs, Dependabot, a repo not set up yet) or
# while sonar-project.properties still has REPLACE_ME values, the guard step skips the scan with a
# notice and the job stays green. Setup steps: docs/sonarcloud.md in the factory repository.
# To make a failed quality gate fail this job, add `args: -Dsonar.qualitygate.wait=true` to the scan.
# `factory adopt` / `factory sync` point the push trigger at the project's default branch when they create
# this file. The scan action is pinned to a commit; Dependabot (github-actions) keeps the pin current.
name: sonar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: sonarcloud
    runs-on: ubuntu-latest
    # Fork PRs get no secrets: do not even start for them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check SonarCloud is set up
        id: guard
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          skip() {
            echo "::notice title=SonarCloud scan skipped::$1"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ -z "${SONAR_TOKEN:-}" ]; then
            skip "The SONAR_TOKEN secret is not available to this run (fork or Dependabot pull request, or not set up yet). Nothing was scanned."
          fi
          if [ ! -f sonar-project.properties ]; then
            skip "sonar-project.properties is missing. Nothing was scanned."
          fi
          if grep -Eq '^[[:space:]]*[^#[:space:]].*REPLACE_ME' sonar-project.properties; then
            skip "sonar-project.properties still has REPLACE_ME values: set the organization and project key in it. Nothing was scanned."
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Set up Node (from .nvmrc)
        if: steps.guard.outputs.enabled == 'true' && hashFiles('.nvmrc') != ''
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Node (default)
        if: steps.guard.outputs.enabled == 'true' && hashFiles('.nvmrc') == ''
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: npm ci
      - name: Tests with coverage (adapt to your project; the report goes to coverage/lcov.info)
        if: steps.guard.outputs.enabled == 'true'
        run: npm test --if-present -- --coverage
      - name: SonarCloud scan
        if: steps.guard.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
