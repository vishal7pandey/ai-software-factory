[project]
name = "swfactory"
version = "0.1.0"
description = "AI software factory: engineering method (skills, policies, templates) plus a thin CLI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
factory = "swfactory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swfactory"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_runner: use the real command runner of adopt (spawns a trivial command)"]

[tool.ruff]
line-length = 100
extend-exclude = ["templates"]  # placeholder files ({{name}}) are not valid Python/TOML
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
